name: Bundle Size

# Mede o tamanho dos bundles JS (js/dist/**.js, bruto + gzip, incluindo os
# chunks sob demanda). Em PR, compara com a linha de base do último push em
# main e comenta as diferenças. Só informa — não bloqueia o merge.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# §35.13 C1 — default-deny do GITHUB_TOKEN.
permissions: {}

concurrency:
  group: bundlesize-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Medir bundles (forum.js / admin.js)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: js/package-lock.json

      - name: Build de produção (webpack)
        working-directory: js
        # Só o webpack: os `flarum/*` são externals, então não precisa de
        # composer/vendor para gerar o bundle. (Lint/tsc ficam no ci.yml.)
        run: |
          npm ci
          node_modules/.bin/webpack --mode production

      - name: Medir tamanho do bundle
        run: node .github/scripts/bundle-size.mjs measure js/dist bundle-size.json

      - name: Subir artefato (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bundle-pr-${{ github.event.pull_request.number }}
          path: bundle-size.json
          retention-days: 14
          overwrite: true

      - name: Subir artefato (main baseline)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bundle-main
          path: bundle-size.json
          retention-days: 90
          overwrite: true

  compare:
    name: Comparar PR vs main
    needs: measure
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout (para o script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20

      - name: Baixar resultado desta PR
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: bundle-pr-${{ github.event.pull_request.number }}
          path: pr

      # Cross-workflow-run: último artefato 'bundle-main' do último run com
      # sucesso do bundle-size.yml em main.
      - name: Baixar baseline do main
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151  # v21
        with:
          workflow: bundle-size.yml
          workflow_conclusion: success
          branch: main
          name: bundle-main
          path: baseline
          if_no_artifact_found: warn

      - name: Gerar markdown comparativo
        run: |
          node .github/scripts/bundle-size.mjs compare pr/bundle-size.json baseline/bundle-size.json > comparison.md
          echo "----"; cat comparison.md

      - name: Encontrar comentário existente
        id: find_comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad  # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: 'Bundle size'

      - name: Comentar (criar ou atualizar)
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9  # v5.0.0
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: comparison.md
          edit-mode: replace
