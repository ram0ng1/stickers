name: Release Workflow

on:
  push:
    branches:
      - main

# CLAUDE.md §35.13/C1 — default-deny token scope at the workflow level.
permissions: {}

# CLAUDE.md §35.13/I4 — queue concurrent releases; never cancel a release mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_release:
    name: Build and Auto-Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write           # create releases + tags
      pull-requests: read       # release-drafter needs to read merged PRs
      id-token: write           # CLAUDE.md §35.13/R4 — SLSA attestation
      attestations: write       # CLAUDE.md §35.13/R4 — SLSA attestation
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: js/package-lock.json

      - name: Install JS dependencies
        run: |
          cd js
          npm ci

      - name: Build JS (Flarum)
        run: |
          cd js
          npm run build

      - name: Detect composer.json version change
        id: check_version
        uses: EndBug/version-check@095362f3cd50f690c8fa0e6afeea81834bd8d320 # v3.0.0
        with:
          file-name: composer.json
          diff-search: true

      - name: Publish GitHub Release
        id: create_release
        if: steps.check_version.outputs.changed == 'true'
        uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6
        with:
          publish: true
          tag: v${{ steps.check_version.outputs.version }}
          name: v${{ steps.check_version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance (SLSA)
        # CLAUDE.md §35.13/R4 — signed provenance for release artifacts.
        if: steps.check_version.outputs.changed == 'true' && steps.create_release.outcome == 'success'
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            composer.json
            js/dist/forum.js
            js/dist/admin.js

      - name: Post release to Flarum forum
        if: |
          steps.check_version.outputs.changed == 'true'
          && steps.create_release.outcome == 'success'
          && steps.create_release.outputs.html_url
          && vars.FLARUM_DISCUSSION_ID != ''
        env:
          FLARUM_API_KEY: ${{ secrets.FLARUM_API_KEY }}
          FLARUM_DISCUSSION_ID: ${{ vars.FLARUM_DISCUSSION_ID }}
          RELEASE_TAG: ${{ steps.create_release.outputs.tag_name }}
          RELEASE_BODY: ${{ steps.create_release.outputs.body }}
          RELEASE_URL: ${{ steps.create_release.outputs.html_url }}
        run: |
          # Extract version from tag (remove leading 'v' if present)
          VERSION="${RELEASE_TAG#v}"

          PAYLOAD=$(jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg body "$RELEASE_BODY" \
            --arg url "$RELEASE_URL" \
            --arg version "$VERSION" \
            --arg discussion_id "$FLARUM_DISCUSSION_ID" \
            '{
              "data": {
                "type": "posts",
                "attributes": {
                  "content": ("## " + $tag + "\n\n" + $body + "\n\n**Installation:**\n```\ncomposer require ramon/stickers:" + $version + "\n```\n\n[See release on GitHub](" + $url + ")")
                },
                "relationships": {
                  "discussion": {
                    "data": {
                      "type": "discussions",
                      "id": $discussion_id
                    }
                  }
                }
              }
            }')

          HTTP_STATUS=$(curl -s -o /tmp/flarum_response.json -w "%{http_code}" \
            -X POST "https://ramonguilherme.com.br/api/posts" \
            -H "Authorization: Token ${FLARUM_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Comment published successfully on Flarum."
            echo "Post ID: $(jq -r '.data.id // empty' /tmp/flarum_response.json)"
          else
            echo "Failed to publish comment on Flarum (HTTP $HTTP_STATUS)"
            echo "Response body:"
            jq '.' /tmp/flarum_response.json
            exit 1
          fi

      - name: Status log
        run: |
          echo "Version changed: ${{ steps.check_version.outputs.changed }}"
          echo "New version: ${{ steps.check_version.outputs.version }}"
