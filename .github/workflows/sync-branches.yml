name: Sync Branches with Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

# CLAUDE.md §35.13/C1 — default-deny token scope at the workflow level.
permissions: {}

concurrency:
  group: sync-branches
  cancel-in-progress: false

jobs:
  sync:
    name: Sync branches with main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync branches with main
        run: |
          git fetch --all

          BRANCHES=$(git branch -r \
            | grep -v 'HEAD' \
            | grep -v 'origin/main' \
            | grep -v 'origin/copilot/' \
            | grep -v 'origin/dependabot/' \
            | grep -v 'origin/claude/' \
            | sed 's|origin/||' \
            | tr -d ' ')

          for branch in $BRANCHES; do
            echo "Syncing branch: $branch"

            git checkout -B "$branch" "origin/$branch"

            if ! git merge-base origin/main "origin/$branch" >/dev/null 2>&1; then
              echo "Branch '$branch' sem histórico comum com main (pré-reescrita) — pulando"
              continue
            fi

            if git merge origin/main --no-edit -m "chore: sync with main"; then
              git push origin "$branch"
              echo "Branch '$branch' synced successfully"
            else
              echo "Conflict syncing '$branch' with main — skipping"
              git merge --abort 2>/dev/null || true
            fi
          done
