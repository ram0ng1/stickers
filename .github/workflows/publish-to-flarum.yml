name: Publish Release to Flarum

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v2.0.6)'
        required: true
      release_body:
        description: 'Release body / description'
        required: false
        default: ''
      release_url:
        description: 'GitHub release URL'
        required: false
        default: ''

# CLAUDE.md §35.13/C1 — default-deny (this workflow only calls an external API).
permissions: {}

# CLAUDE.md §35.13/I4 — never run two forum-publish jobs in parallel.
concurrency:
  group: publish-flarum-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish_to_flarum:
    name: Post to Forum
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          # CLAUDE.md §35.13/I3 — this job ships secrets to a single external API.
          # Allowlist that exact host so a compromised action can't exfiltrate elsewhere.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            ramonguilherme.com.br:443

      - name: Validate FLARUM_DISCUSSION_ID
        env:
          FLARUM_DISCUSSION_ID: ${{ vars.FLARUM_DISCUSSION_ID }}
        run: |
          if [ -z "$FLARUM_DISCUSSION_ID" ]; then
            echo "Error: FLARUM_DISCUSSION_ID is not configured in the repository variables."
            echo "Configure it under: Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          echo "FLARUM_DISCUSSION_ID is configured: $FLARUM_DISCUSSION_ID"

      - name: Post release comment to Flarum
        env:
          FLARUM_API_KEY: ${{ secrets.FLARUM_API_KEY }}
          FLARUM_DISCUSSION_ID: ${{ vars.FLARUM_DISCUSSION_ID }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          RELEASE_BODY: ${{ github.event.release.body || inputs.release_body }}
          RELEASE_URL: ${{ github.event.release.html_url || inputs.release_url }}
        run: |
          # Extract version from tag (remove leading 'v' if present)
          VERSION="${RELEASE_TAG#v}"

          # Build the JSON payload using jq to safely handle all special characters
          PAYLOAD=$(jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg body "$RELEASE_BODY" \
            --arg url "$RELEASE_URL" \
            --arg version "$VERSION" \
            --arg discussion_id "$FLARUM_DISCUSSION_ID" \
            '{
              "data": {
                "type": "posts",
                "attributes": {
                  "content": ("## " + $tag + "\n\n" + $body + "\n\n**Installation:**\n```\ncomposer require ramon/stickers:" + $version + "\n```\n\n[See release on GitHub](" + $url + ")")
                },
                "relationships": {
                  "discussion": {
                    "data": {
                      "type": "discussions",
                      "id": $discussion_id
                    }
                  }
                }
              }
            }')

          echo "Payload preview:"
          echo "$PAYLOAD" | jq '.'

          HTTP_STATUS=$(curl -s -o /tmp/flarum_response.json -w "%{http_code}" \
            -X POST "https://ramonguilherme.com.br/api/posts" \
            -H "Authorization: Token ${FLARUM_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Comment published successfully on Flarum."
            echo "Post ID: $(jq -r '.data.id // empty' /tmp/flarum_response.json)"
          else
            echo "Failed to publish comment on Flarum (HTTP $HTTP_STATUS)"
            echo "Response body:"
            jq '.' /tmp/flarum_response.json
            exit 1
          fi
