name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
exclude-labels:
  - 'pular changelog'
categories:
  - title: 'Alterações Críticas (Breaking Changes)'
    labels:
      - 'BC'
  - title: 'Melhoria'
    labels:
      - 'melhoria'
  - title: 'Correções de Erros'
    labels:
      - 'correcao'
  - title: 'Performance'
    labels:
      - 'performance'
  - title: 'Documentação'
    labels:
      - 'documentacao'
  - title: 'Refatoração'
    labels:
      - 'refatoracao'
  - title: 'Dependências'
    labels:
      - 'dependencias'
  - title: 'Traduções'
    labels:
      - 'traducao'
  - title: 'Manutenção'
    labels:
      - 'manutencao'
# The release version is computed in release-management.yml from the latest
# git tag (label "BC" => minor; any other => patch) and passed explicitly to
# release-drafter via the `version` input. This resolver is fallback/docs only
# and mirrors the same rule — no automatic "major".
version-resolver:
  minor:
    labels:
      - 'BC'
  patch:
    labels:
      - 'melhoria'
      - 'correcao'
      - 'performance'
      - 'documentacao'
      - 'refatoracao'
      - 'dependencias'
      - 'traducao'
      - 'manutencao'
  default: patch
change-template: '- $TITLE (PR #$NUMBER) por @$AUTHOR'
template: |
  ## O que mudou na extensão Stickers
  $CHANGES

  ## Como atualizar

  ```bash
  composer require ramon/stickers:$RESOLVED_VERSION
  php flarum cache:clear
  php flarum assets:publish
  ```
